name: Respaldo Automático de Supabase

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Instalar Supabase CLI
      run: |
        npm install -g supabase

    - name: Generar respaldo SQL
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      run: |
        mkdir -p respaldos
        
        # 1. Forzamos el enlace del proyecto usando la conexión alternativa de IPv4
        supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}" --use-pooler
        
        # 2. Realizamos el volcado utilizando la configuración ya enlazada de forma segura
        supabase db dump --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}" > respaldos/backup_$(date +%Y-%m-%d_%H%M%S).sql

    - name: Subir respaldo al repositorio privado
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add respaldos/
        git commit -m "Respaldo automático generado el $(date +%Y-%m-%d)"
        git push
